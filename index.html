<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#1f2937"><title>Atelier</title><link rel=manifest href="./manifest.webmanifest?v=42"><link rel=icon href=./icon-192.png><link rel=apple-touch-icon href=./icon-192.png><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 44px}h1{margin:0;font-size:34px}.sub{color:#6b7280;font-size:18px;margin:4px 0 22px}button{font:inherit}.home{display:grid;gap:16px}.home button{background:#fff;border:0;border-radius:24px;padding:27px;text-align:left;box-shadow:0 2px 6px #0001}.home b{font-size:23px}.home span{display:block;color:#6b7280;margin-top:7px}.back{border:0;background:#e5e7eb;border-radius:14px;padding:10px 15px;font-weight:800;margin-bottom:18px}.mats{display:grid;grid-template-columns:1.2fr .7fr 1fr;gap:7px;margin-bottom:20px}.mat,.tab{border:0;background:#e5e7eb;color:#374151;font-weight:800}.mat{border-radius:15px;padding:14px 4px;font-size:14px}.mat.on,.tab.on,.calc,.add{background:#1f2937;color:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}.tab{border-radius:20px;padding:18px 6px;font-size:20px}.card{background:#fff;border-radius:25px;padding:27px;margin-bottom:20px;box-shadow:0 2px 5px #0001}label{display:block;font-weight:750;font-size:19px;margin:10px 0 8px}select,input{width:100%;font:inherit;font-size:22px;padding:16px;border:2px solid #d1d5db;border-radius:16px;background:#fff}.pill{display:inline-block;background:#f3f4f6;color:#6b7280;padding:9px 14px;border-radius:999px;font-size:16px;margin:14px 0}.calc,.add{width:100%;border:0;border-radius:18px;padding:19px;font-weight:800;font-size:21px;margin:18px 0}.result{text-align:center}.value{font-size:42px;font-weight:800;margin:8px}.detail,.small{color:#6b7280;font-size:16px;line-height:1.5}.hide{display:none}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.jt{font-size:21px;font-weight:850}.rm{width:34px;height:34px;flex:0 0 34px;border:0;border-radius:50%;background:#fee2e2;color:#991b1b;font-size:25px;line-height:30px;padding:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.jr{background:#f3f4f6;border-radius:16px;padding:14px;margin-top:16px;font-weight:700;line-height:1.55}.tot{background:#111827;color:#fff}.tot .small{color:#d1d5db}.ref{font-size:18px;padding:13px 15px}@media(max-width:430px){.mat{font-size:12px}.card{padding:23px 20px}.row{grid-template-columns:1fr}}
</style></head><body><main>
<section id=menu><h1>ATELIER</h1><div class=sub>Outils de production</div><div class=home><button onclick="page('roll')"><b>Calcul Bobines</b><span>Papier Rotative • Foil • Pelliculage</span></button><button onclick="page('jobs')"><b>Calcul longueur Job</b><span>Notices • métrage et temps de production</span></button></div></section>
<section id=roll class=hide><button class=back onclick="page('menu')">← ATELIER</button><h1>Calcul Bobine</h1><div class=sub id=rsub></div><div class=mats><button class="mat on" data-k=paper>PAPIER<br>Rotative</button><button class=mat data-k=foil>FOIL</button><button class=mat data-k=lam>PELLICULAGE</button></div><div class=tabs><button id=td class="tab on">Diamètre →<br>mètres</button><button id=tl class=tab>Mètres →<br>diamètre</button></div><div class=card><label id=cl></label><select id=choice></select><div class=pill id=core></div><div id=db><label>Diamètre extérieur de la bobine</label><input id=d type=number value=847> mm</div><div id=lb class=hide><label>Longueur de matière</label><input id=l type=number value=10000> m</div><button id=go class=calc>CALCULER</button></div><div class="card result"><div id=lab></div><div class=value id=res>—</div><div class=detail id=det></div></div></section>
<section id=jobs class=hide><button class=back onclick="page('menu')">← ATELIER</button><h1>Calcul longueur Job</h1><div class=sub>Notices • Rotative 75 m/min • V4.2</div><div id=list></div><button class=add onclick=addJob()>＋ AJOUTER UN CAHIER</button><div class="card tot result"><div>MÉTRAGE TOTAL</div><div class=value id=tm>0 m</div><div>TEMPS MACHINE TOTAL</div><div class=value id=tt>0 h 00 min</div><div class=small>Somme de tous les cahiers ajoutés</div></div></section>
<script>
const P=[["BURGO 45g", 54], ["OFFSET Premium 70g", 90], ["DNS 90g", 115], ["DNS 120g", 153], ["NEUJET 90g", 95], ["MUNKEN White 80g", 140], ["MUNKEN Cream 90g", 158], ["NAUTILUS SuperWhite 90g", 118]],L=[["Pelliculage brillant", 22], ["Pelliculage mat", 27], ["Pelliculage Soft touch", 33]],D={paper:{title:"Papier Rotative",core:120,label:"Papier",items:P},foil:{title:"Foil",core:30,label:"Matière",items:[["FOIL",15]]},lam:{title:"Pelliculage",core:92,label:"Pelliculage",items:L}},
J={12:{pose:2,len:.555,mult:1,desc:"double pose ×2"},16:{pose:2,len:.740,mult:1,desc:"double pose ×2"},20:{pose:2,len:.925,mult:1,desc:"double pose ×2"},24:{pose:1,len:.555,mult:1,desc:"simple pose"},32:{pose:1,len:.740,mult:1,desc:"simple pose"},40:{pose:1,len:.925,mult:1,desc:"simple pose"},48:{pose:1,len:.555,mult:2,desc:"2 × 24 pages"},64:{pose:1,len:.740,mult:2,desc:"2 × 32 pages"}},
$=x=>document.getElementById(x);let k="paper",mode="d",jid=0;
function page(x){["menu","roll","jobs"].forEach(y=>$(y).classList.toggle("hide",y!=x));scrollTo(0,0)}
function load(){let x=D[k];$("rsub").textContent=x.title+" • mandrin Ø "+String(x.core).replace(".",",")+" mm";$("core").textContent="Mandrin : Ø "+String(x.core).replace(".",",")+" mm";$("cl").textContent=x.label;$("choice").innerHTML=x.items.map(i=>`<option value="${i[1]}">${i[0]}</option>`).join("");rollcalc()}
function rollcalc(){let x=D[k],t=+$("choice").value,n=$("choice").selectedOptions[0].text,C=x.core;if(mode=="d"){let d=+$("d").value;if(d<=C)return;let l=Math.PI*(d*d-C*C)/(4*t);$("lab").textContent="Métrage estimé restant";$("res").textContent=Math.round(l).toLocaleString("fr-FR")+" m";$("det").textContent=n+" • bobine Ø "+d+" mm • mandrin Ø "+String(C).replace(".",",")+" mm"}else{let l=+$("l").value,d=Math.sqrt(C*C+4*t*l/Math.PI);$("lab").textContent="Diamètre extérieur estimé";$("res").textContent=d.toLocaleString("fr-FR",{maximumFractionDigits:1})+" mm";$("det").textContent=n+" • "+l.toLocaleString("fr-FR")+" m • mandrin Ø "+String(C).replace(".",",")+" mm"}}
document.querySelectorAll(".mat").forEach(b=>b.onclick=()=>{k=b.dataset.k;document.querySelectorAll(".mat").forEach(z=>z.classList.toggle("on",z==b));load()});$("choice").onchange=rollcalc;$("go").onclick=rollcalc;$("td").onclick=()=>{mode="d";$("td").classList.add("on");$("tl").classList.remove("on");$("db").classList.remove("hide");$("lb").classList.add("hide");rollcalc()};$("tl").onclick=()=>{mode="l";$("tl").classList.add("on");$("td").classList.remove("on");$("lb").classList.remove("hide");$("db").classList.add("hide");rollcalc()};
function ft(x){x=Math.round(x);return Math.floor(x/60)+" h "+String(x%60).padStart(2,"0")+" min"}
function addJob(){jid++;let e=document.createElement("div");e.className="card job";e.id="j"+jid;e.dataset.manualWaste="0";e.innerHTML=`<div class=head><div class=jt>CAHIER</div><button class=rm aria-label="Supprimer ce cahier" onclick="rm(${jid})">×</button></div><label>Référence</label><input class=ref type=text placeholder="Ex. NOTICE ABC123"><label>Pagination</label><select class=pag><option value="12">12 pages</option><option value="16" selected>16 pages</option><option value="20">20 pages</option><option value="24">24 pages</option><option value="32">32 pages</option><option value="40">40 pages</option><option value="48">48 pages</option><option value="64">64 pages</option></select><div class=row><div><label>Quantité</label><input class=qty type=number value=20000></div><div><label>Passe</label><input class=pas type=number value=1500></div></div><div class=jr></div>`;$("list").append(e);
const autoPasse=()=>{if(e.dataset.manualWaste=="0"){const q=parseInt(e.querySelector(".qty").value,10)||0;e.querySelector(".pas").value=(q===5000?1000:1500)}jobs()};e.querySelector(".qty").addEventListener("input",autoPasse);e.querySelector(".qty").addEventListener("change",autoPasse);
e.querySelector(".pas").addEventListener("input",()=>{e.dataset.manualWaste="1";jobs()});
e.querySelector(".pag").addEventListener("input",jobs); jobs()}
function rm(i){$("j"+i)?.remove();jobs()}
function jobs(){let m=0,t=0;document.querySelectorAll(".job").forEach((e,i)=>{e.querySelector(".jt").textContent="CAHIER "+(i+1);let p=+e.querySelector(".pag").value,q=+e.querySelector(".qty").value||0,w=+e.querySelector(".pas").value||0,j=J[p],mm=((q+w)/j.pose)*j.len*j.mult,mn=mm/75;m+=mm;t+=mn;let f=Math.round(j.len*1000);e.querySelector(".jr").innerHTML=`${p} pages • ${j.desc} • format ${f} mm<br><b>${Math.round(mm).toLocaleString("fr-FR")} m — ${ft(mn)}</b>`});$("tm").textContent=Math.round(m).toLocaleString("fr-FR")+" m";$("tt").textContent=ft(t)}
load();addJob();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=42"));
</script></body></html>
