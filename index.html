<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2937"><title>Calcul Bobine</title><link rel="manifest" href="./manifest.webmanifest?v=31"><link rel="icon" href="./icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:720px;margin:auto;padding:24px 16px}h1{margin:0;font-size:34px}.sub{color:#6b7280;font-size:18px;margin:3px 0 20px}.mats{display:grid;grid-template-columns:1.2fr .7fr 1fr;gap:7px;margin-bottom:20px}button{font:inherit}.mat,.tab{border:0;background:#e5e7eb;color:#374151;font-weight:800}.mat{border-radius:15px;padding:14px 4px;font-size:14px}.mat.on,.tab.on,.calc{background:#1f2937;color:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}.tab{border-radius:20px;padding:18px 6px;font-size:20px}.card{background:#fff;border-radius:26px;padding:28px;margin-bottom:24px;box-shadow:0 2px 5px #0001}label{display:block;font-weight:750;font-size:20px;margin:10px 0 9px}select,input{width:100%;font:inherit;font-size:24px;padding:18px;border:2px solid #d1d5db;border-radius:17px;background:#fff}.pill{display:inline-block;background:#f3f4f6;color:#6b7280;padding:9px 14px;border-radius:999px;font-size:17px;margin:15px 0}.calc{width:100%;border:0;border-radius:19px;padding:21px;font-weight:800;font-size:22px;margin-top:22px}.result{text-align:center}.value{font-size:46px;font-weight:800;margin:8px 0}.detail{color:#6b7280;font-size:17px;line-height:1.5}.hide{display:none}@media(max-width:430px){.mat{font-size:12px}.card{padding:25px 21px}}</style></head><body><main><h1>Calcul Bobine</h1><div class="sub" id="sub"></div><div class="mats"><button class="mat on" data-k="paper">PAPIER<br>Rotative</button><button class="mat" data-k="foil">FOIL</button><button class="mat" data-k="lam">PELLICULAGE</button></div><div class="tabs"><button id="td" class="tab on">Diamètre →<br>mètres</button><button id="tl" class="tab">Mètres →<br>diamètre</button></div><div class="card"><div id="cw"><label id="cl"></label><select id="choice"></select></div><div class="pill" id="core"></div><div id="db"><label>Diamètre extérieur de la bobine</label><input id="d" type="number" inputmode="decimal" value="847"> mm</div><div id="lb" class="hide"><label>Longueur de matière</label><input id="l" type="number" inputmode="decimal" value="10000"> m</div><button id="go" class="calc">CALCULER</button></div><div class="card result"><div id="lab"></div><div class="value" id="res">—</div><div class="detail" id="det"></div></div></main><script>
const DATA={paper:{title:"Papier Rotative",core:120,label:"Papier",items:[["BURGO 45g", 54], ["OFFSET Premium 70g", 90], ["DNS 90g", 115], ["DNS 120g", 153], ["NEUJET 90g", 95], ["MUNKEN White 80g", 140], ["MUNKEN Cream 90g", 158], ["NAUTILUS SuperWhite 90g", 118]]},foil:{title:"Foil",core:30,label:"Matière",items:[["FOIL",15]]},lam:{title:"Pelliculage",core:92,label:"Pelliculage",items:[["Pelliculage brillant", 22], ["Pelliculage mat", 27], ["Pelliculage Soft touch", 33]]}};const $=x=>document.getElementById(x);let k="paper",mode="d";function load(){let x=DATA[k];$("sub").textContent=x.title+" • mandrin Ø "+String(x.core).replace(".",",")+" mm";$("core").textContent="Mandrin : Ø "+String(x.core).replace(".",",")+" mm";$("cl").textContent=x.label;$("choice").innerHTML=x.items.map(i=>`<option value="${i[1]}">${i[0]}</option>`).join("");calc()}function calc(){let x=DATA[k],t=+$("choice").value,n=$("choice").options[$("choice").selectedIndex].text,C=x.core;if(mode==="d"){let D=+$("d").value;if(!(D>C))return;let L=Math.PI*(D*D-C*C)/(4*t);$("lab").textContent="Métrage estimé restant";$("res").textContent=Math.round(L).toLocaleString("fr-FR")+" m";$("det").textContent=n+" • bobine Ø "+D.toLocaleString("fr-FR")+" mm • mandrin Ø "+String(C).replace(".",",")+" mm"}else{let L=+$("l").value;if(!(L>=0))return;let D=Math.sqrt(C*C+4*t*L/Math.PI);$("lab").textContent="Diamètre extérieur estimé";$("res").textContent=D.toLocaleString("fr-FR",{maximumFractionDigits:1})+" mm";$("det").textContent=n+" • "+L.toLocaleString("fr-FR")+" m • mandrin Ø "+String(C).replace(".",",")+" mm"}}document.querySelectorAll(".mat").forEach(b=>b.onclick=()=>{k=b.dataset.k;document.querySelectorAll(".mat").forEach(z=>z.classList.toggle("on",z===b));load()});$("choice").onchange=calc;$("go").onclick=calc;$("td").onclick=()=>{mode="d";$("td").classList.add("on");$("tl").classList.remove("on");$("db").classList.remove("hide");$("lb").classList.add("hide");calc()};$("tl").onclick=()=>{mode="l";$("tl").classList.add("on");$("td").classList.remove("on");$("lb").classList.remove("hide");$("db").classList.add("hide");calc()};load();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=31"));</script></body></html>
