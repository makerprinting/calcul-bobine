<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2937"><title>Calcul Bobine</title><link rel="manifest" href="./manifest.webmanifest?v=21"><link rel="icon" href="./icon-192.png?v=21"><link rel="apple-touch-icon" href="./icon-192.png?v=21"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:700px;margin:auto;padding:28px 18px}h1{margin:0;font-size:36px}.sub{color:#6b7280;font-size:19px;margin:3px 0 26px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}button{font:inherit}.tab{border:0;border-radius:22px;padding:22px 8px;font-weight:800;font-size:22px;background:#e5e7eb;color:#374151}.tab.on,.calc{background:#1f2937;color:white}.card{background:white;border-radius:28px;padding:34px;margin-bottom:26px;box-shadow:0 2px 5px #0001}label{display:block;font-weight:750;font-size:20px;margin:12px 0 9px}select,input{width:100%;font:inherit;font-size:25px;padding:20px;border:2px solid #d1d5db;border-radius:18px;background:white}.pills{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 22px}.pill{background:#f3f4f6;color:#6b7280;padding:10px 15px;border-radius:999px;font-size:18px}.calc{width:100%;border:0;border-radius:20px;padding:22px;font-weight:800;font-size:23px;margin-top:24px}.result{text-align:center}.value{font-size:48px;font-weight:800;margin:8px 0}.detail{color:#6b7280;font-size:17px;line-height:1.5}.hide{display:none}
</style></head><body><main><h1>Calcul Bobine</h1><div class="sub">Calculateur atelier • mandrin Ø 120 mm</div><div class="tabs"><button id="td" class="tab on">Diamètre →<br>mètres</button><button id="tl" class="tab">Mètres →<br>diamètre</button></div><div class="card"><label>Papier</label><select id="p"><option value="54">BURGO 45g — 54 µm</option><option value="90">OFFSET Premium 70g — 90 µm</option><option value="115">DNS 90g — 115 µm</option><option value="153">DNS 120g — 153 µm</option><option value="95">NEUJET 90g — 95 µm</option><option value="140">MUNKEN White 80g — 140 µm</option><option value="158">MUNKEN Cream 90g — 158 µm</option><option value="118">NAUTILUS SuperWhite 90g — 118 µm</option></select><div class="pills"><span class="pill" id="ep">Épaisseur : 54 µm</span><span class="pill">Mandrin : Ø 120 mm</span></div><div id="db"><label>Diamètre extérieur de la bobine</label><input id="d" type="number" inputmode="decimal" value="847"> mm</div><div id="lb" class="hide"><label>Longueur de papier</label><input id="l" type="number" inputmode="decimal" value="10000"> m</div><button id="go" class="calc">CALCULER</button></div><div class="card result"><div id="lab">Métrage estimé restant</div><div class="value" id="res">—</div><div class="detail" id="det"></div></div></main><script>
const C=120,$=x=>document.getElementById(x);let m='d';function calc(){let t=+$('p').value,n=$('p').options[$('p').selectedIndex].text.split(' — ')[0];$('ep').textContent='Épaisseur : '+t+' µm';if(m==='d'){let D=+$('d').value,L=Math.PI*(D*D-C*C)/(4*t);$('lab').textContent='Métrage estimé restant';$('res').textContent=Math.round(L).toLocaleString('fr-FR')+' m';$('det').textContent=`${n} • ${t} µm • bobine Ø ${D} mm • mandrin Ø 120 mm`}else{let L=+$('l').value,D=Math.sqrt(C*C+4*t*L/Math.PI);$('lab').textContent='Diamètre extérieur estimé';$('res').textContent=D.toLocaleString('fr-FR',{maximumFractionDigits:1})+' mm';$('det').textContent=`${n} • ${t} µm • ${L.toLocaleString('fr-FR')} m • mandrin Ø 120 mm`}}$('p').onchange=calc;$('go').onclick=calc;$('td').onclick=()=>{m='d';$('td').classList.add('on');$('tl').classList.remove('on');$('db').classList.remove('hide');$('lb').classList.add('hide');calc()};$('tl').onclick=()=>{m='l';$('tl').classList.add('on');$('td').classList.remove('on');$('lb').classList.remove('hide');$('db').classList.add('hide');calc()};calc();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=21'));
</script></body></html>
